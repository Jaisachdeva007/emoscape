<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmoScape — Emotional Landscape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; color: #e4e4f0; font-family: system-ui, sans-serif; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; display: block; }

  #ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }

  #top-bar {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,30,0.8); backdrop-filter: blur(12px);
    border: 1px solid rgba(139,92,246,0.3); border-radius: 50px;
    padding: 10px 24px; display: flex; gap: 20px; align-items: center;
    pointer-events: all;
  }
  #top-bar h1 { font-size: 1rem; font-weight: 700; color: #a78bfa; }
  .tab-btn {
    background: none; border: none; color: #8b8b9e; cursor: pointer;
    font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; transition: all 0.2s;
  }
  .tab-btn.active { background: rgba(139,92,246,0.2); color: #a78bfa; }

  #session-panel {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(8,8,20,0.9); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(139,92,246,0.2);
    padding: 20px; display: flex; gap: 16px; align-items: flex-end;
    pointer-events: all; transform: translateY(0); transition: transform 0.3s;
  }
  #session-panel.hidden { transform: translateY(100%); }

  #chat-area {
    flex: 1; max-height: 200px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { padding: 8px 14px; border-radius: 12px; font-size: 0.9rem; max-width: 80%; line-height: 1.5; }
  .msg.user { background: rgba(99,102,241,0.2); align-self: flex-end; color: #c4b5fd; }
  .msg.agent { background: rgba(255,255,255,0.06); align-self: flex-start; color: #e4e4f0; }

  #input-area { display: flex; gap: 10px; min-width: 300px; }
  #text-input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(139,92,246,0.3);
    border-radius: 8px; padding: 10px 14px; color: #e4e4f0; font-size: 0.9rem;
    outline: none; resize: none;
  }
  #text-input:focus { border-color: #8b5cf6; }
  .action-btn {
    background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none;
    border-radius: 8px; padding: 10px 18px; color: white; cursor: pointer;
    font-size: 0.85rem; font-weight: 600; white-space: nowrap;
  }
  .action-btn:hover { opacity: 0.9; }
  .action-btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .action-btn.secondary { background: rgba(255,255,255,0.1); }

  #node-tooltip {
    position: absolute; pointer-events: none;
    background: rgba(10,10,30,0.95); backdrop-filter: blur(12px);
    border: 1px solid rgba(139,92,246,0.4); border-radius: 10px;
    padding: 14px 18px; min-width: 200px; display: none;
  }
  #node-tooltip h3 { font-size: 0.9rem; color: #a78bfa; margin-bottom: 4px; }
  #node-tooltip p { font-size: 0.8rem; color: #8b8b9e; line-height: 1.5; }

  #status { position: absolute; top: 80px; right: 20px; font-size: 0.8rem; color: #52525b; }

  #legend {
    position: absolute; bottom: 20px; right: 20px;
    background: rgba(10,10,30,0.8); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 14px; font-size: 0.75rem;
    pointer-events: none;
  }
  #legend h4 { color: #a78bfa; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: #8b8b9e; }
  .legend-color { width: 24px; height: 6px; border-radius: 3px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div id="top-bar">
    <h1>🧠 EmoScape</h1>
    <button class="tab-btn active" onclick="showView('landscape')">Landscape</button>
    <button class="tab-btn" onclick="showView('session')">Reflect</button>
    <span id="session-count" style="font-size:0.8rem;color:#52525b">0 sessions</span>
  </div>

  <div id="session-panel">
    <div id="chat-area">
      <div class="msg agent">Welcome. I'm here to help you reflect. What's on your mind today?</div>
    </div>
    <div id="input-area">
      <textarea id="text-input" rows="2" placeholder="Type your thoughts... (Enter to send)"></textarea>
      <button class="action-btn" onclick="sendMessage()">Send</button>
      <button class="action-btn danger" onclick="endSession()">End Session</button>
    </div>
  </div>

  <div id="node-tooltip">
    <h3 id="tooltip-theme">Theme</h3>
    <p id="tooltip-date">Date</p>
    <p id="tooltip-summary">Summary</p>
    <p id="tooltip-stats">Stats</p>
  </div>

  <div id="status">Loading...</div>

  <div id="legend" style="display:none">
    <h4>Visual Guide</h4>
    <div class="legend-item"><div class="legend-color" style="background:#ef4444"></div> High arousal / stress</div>
    <div class="legend-item"><div class="legend-color" style="background:#3b82f6"></div> Low arousal / calm</div>
    <div class="legend-item"><span>↑ Higher = more positive</span></div>
    <div class="legend-item"><span>Thicker = longer session</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ====== STATE ======
let currentSessionId = null;
let sessionStartTime = null;
let turnCount = 0;
let currentView = 'landscape';
let sessions = [];

// ====== THREE.JS SETUP ======
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050510);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.02);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 20);
camera.lookAt(0, 0, 0);

// Lighting
const ambient = new THREE.AmbientLight(0x1a1a3e, 2);
scene.add(ambient);
const pointLight = new THREE.PointLight(0x8b5cf6, 3, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// Grid floor
const gridHelper = new THREE.GridHelper(100, 40, 0x1a1a3e, 0x0d0d1f);
gridHelper.position.y = -5;
scene.add(gridHelper);

// Stars background
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 2000; i++) {
  starVerts.push((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x444466, size: 0.3 }));
scene.add(stars);

// ====== ORBIT CONTROLS (simple) ======
let isDragging = false, prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0, phi: Math.PI / 3, radius: 25 };

canvas.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  spherical.theta -= (e.clientX - prevMouse.x) * 0.01;
  spherical.phi = Math.max(0.2, Math.min(Math.PI - 0.2, spherical.phi - (e.clientY - prevMouse.y) * 0.01));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
canvas.addEventListener('wheel', e => {
  spherical.radius = Math.max(5, Math.min(80, spherical.radius + e.deltaY * 0.05));
  updateCamera();
});

function updateCamera() {
  camera.position.set(
    spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta),
    spherical.radius * Math.cos(spherical.phi),
    spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}

// ====== SPLINE RENDERING ======
let splineGroup = new THREE.Group();
scene.add(splineGroup);
let nodeMeshes = [];

function arousalToColor(arousal) {
  // Blue (calm) → Purple → Red (stressed)
  const r = Math.round(arousal * 239 + (1 - arousal) * 59);
  const g = Math.round((1 - arousal) * 130);
  const b = Math.round((1 - arousal) * 246 + arousal * 68);
  return new THREE.Color(r / 255, g / 255, b / 255);
}

function buildSpline(sessionData) {
  // Clear previous
  while (splineGroup.children.length > 0) splineGroup.remove(splineGroup.children[0]);
  nodeMeshes = [];

  if (sessionData.length === 0) return;

  // Map sessions to 3D points
  const points = sessionData.map((s, i) => new THREE.Vector3(
    (i / Math.max(sessionData.length - 1, 1)) * 30 - 15,  // X: time axis
    s.valence * 6,                                          // Y: valence (height)
    0                                                       // Z: flat (future: topic clustering)
  ));

  if (points.length >= 2) {
    const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
    const tubePoints = curve.getPoints(200);

    // Draw segmented tube with color per session
    for (let i = 0; i < sessionData.length - 1; i++) {
      const segPoints = curve.getPoints(200).slice(
        Math.floor(i / sessionData.length * 200),
        Math.floor((i + 1) / sessionData.length * 200) + 1
      );
      if (segPoints.length < 2) continue;

      const segCurve = new THREE.CatmullRomCurve3(segPoints);
      const thickness = 0.05 + sessionData[i].intensity * 0.2;
      const geo = new THREE.TubeGeometry(segCurve, 20, thickness, 8, false);
      const mat = new THREE.MeshPhongMaterial({
        color: arousalToColor(sessionData[i].arousal),
        emissive: arousalToColor(sessionData[i].arousal),
        emissiveIntensity: 0.3,
        transparent: true, opacity: 0.85
      });
      splineGroup.add(new THREE.Mesh(geo, mat));
    }
  }

  // Draw session nodes
  sessionData.forEach((s, i) => {
    const pos = points[i];
    const geo = new THREE.SphereGeometry(0.25 + s.intensity * 0.15, 16, 16);
    const mat = new THREE.MeshPhongMaterial({
      color: arousalToColor(s.arousal),
      emissive: arousalToColor(s.arousal),
      emissiveIntensity: 0.5
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    mesh.userData = { session: s, index: i };
    splineGroup.add(mesh);
    nodeMeshes.push(mesh);

    // Glow ring
    const ringGeo = new THREE.RingGeometry(0.35, 0.45, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: arousalToColor(s.arousal), transparent: true, opacity: 0.3, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(pos);
    ring.lookAt(camera.position);
    splineGroup.add(ring);
  });

  document.getElementById('session-count').textContent = `${sessionData.length} session${sessionData.length !== 1 ? 's' : ''}`;
  document.getElementById('legend').style.display = sessionData.length > 0 ? 'block' : 'none';
}

// ====== TOOLTIP ON HOVER ======
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('node-tooltip');

canvas.addEventListener('mousemove', e => {
  if (isDragging) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);

  if (hits.length > 0) {
    const s = hits[0].object.userData.session;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 60) + 'px';
    document.getElementById('tooltip-theme').textContent = s.theme || 'Reflection';
    document.getElementById('tooltip-date').textContent = new Date(s.created_at).toLocaleDateString('en-CA', { weekday: 'long', month: 'short', day: 'numeric' });
    document.getElementById('tooltip-summary').textContent = s.summary || '';
    document.getElementById('tooltip-stats').textContent = `Valence: ${s.valence > 0 ? '+' : ''}${s.valence.toFixed(2)} · Arousal: ${(s.arousal * 100).toFixed(0)}%`;
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

// ====== SESSION MANAGEMENT ======
async function startNewSession() {
  const res = await fetch('/session/start', { method: 'POST' });
  const data = await res.json();
  currentSessionId = data.session_id;
  sessionStartTime = Date.now();
  turnCount = 0;
  document.getElementById('chat-area').innerHTML = '<div class="msg agent">Welcome. I\'m here to help you reflect. What\'s on your mind today?</div>';
  setStatus('Session active');
}

async function sendMessage() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text || !currentSessionId) return;

  addMessage('user', text);
  input.value = '';
  turnCount++;

  try {
    const res = await fetch('/session/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentSessionId, text })
    });
    const data = await res.json();
    addMessage('agent', data.reply);
  } catch (e) {
    addMessage('agent', 'I\'m still here. Please try again.');
  }
}

async function endSession() {
  if (!currentSessionId) return;
  const duration = (Date.now() - sessionStartTime) / 1000;
  setStatus('Processing session...');

  try {
    const res = await fetch('/session/end', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentSessionId, duration_seconds: duration, turn_count: turnCount })
    });
    const data = await res.json();
    currentSessionId = null;
    addMessage('agent', `Session complete. Theme: "${data.theme}". Your emotional landscape has been updated.`);
    await loadSessions();
    showView('landscape');
    setStatus('Session saved');
  } catch (e) {
    setStatus('Error saving session');
  }
}

function addMessage(speaker, text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = `msg ${speaker}`;
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// ====== VIEWS ======
function showView(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['landscape', 'session'][i] === view);
  });

  const panel = document.getElementById('session-panel');
  if (view === 'session') {
    panel.classList.remove('hidden');
    if (!currentSessionId) startNewSession();
  } else {
    panel.classList.add('hidden');
  }
}

// ====== DATA LOADING ======
async function loadSessions() {
  try {
    const res = await fetch('/sessions');
    sessions = await res.json();
    buildSpline(sessions);
    setStatus(sessions.length === 0 ? 'No sessions yet — click Reflect to start' : `${sessions.length} sessions loaded`);
  } catch (e) {
    setStatus('Connecting to server...');
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// ====== INPUT HANDLING ======
document.getElementById('text-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ====== RESIZE ======
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ====== ANIMATION LOOP ======
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;
  stars.rotation.y += 0.0002;
  pointLight.position.x = Math.sin(t) * 5;
  pointLight.position.z = Math.cos(t) * 5;
  // Make rings face camera
  splineGroup.children.forEach(child => {
    if (child.geometry && child.geometry.type === 'RingGeometry') child.lookAt(camera.position);
  });
  renderer.render(scene, camera);
}
animate();

// ====== INIT ======
loadSessions();
document.getElementById('session-panel').classList.add('hidden');
setStatus('Ready');
</script>
</body>
</html>
