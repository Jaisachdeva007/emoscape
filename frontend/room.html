<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmoScape — Session Room</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#06060f; color:#e4e4f0; font-family:system-ui,sans-serif; overflow:hidden; height:100vh; }
#canvas { width:100vw; height:100vh; display:block; position:fixed; top:0; left:0; }

#hud {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  padding:20px 32px 28px;
  background:linear-gradient(to top, rgba(4,4,14,1) 50%, transparent);
}
#hud-inner { max-width:680px; margin:0 auto; }
#transcript {
  max-height:130px; overflow-y:auto; margin-bottom:14px; padding:0 2px;
  scrollbar-width:thin; scrollbar-color:rgba(139,92,246,.2) transparent;
}
.line { font-size:.88rem; line-height:1.6; margin-bottom:5px; animation:fadeUp .25s ease; }
.line.agent { color:#c4b5fd; }
.line.agent::before { content:'✦ '; opacity:.4; }
.line.user { color:#4a4a6a; font-style:italic; }
.line.user::before { content:'you · '; opacity:.4; font-style:normal; }
@keyframes fadeUp { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }

#controls { display:flex; gap:12px; align-items:center; }
#mic-btn {
  width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
  font-size:1.3rem; display:flex; align-items:center; justify-content:center;
  transition:all .25s; flex-shrink:0;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  box-shadow:0 4px 20px rgba(99,102,241,.4);
}
#mic-btn.listening {
  background:linear-gradient(135deg,#ef4444,#dc2626);
  box-shadow:0 0 0 0 rgba(239,68,68,.5);
  animation:pulse 1.4s infinite;
}
#mic-btn.speaking { background:linear-gradient(135deg,#059669,#10b981); }
@keyframes pulse {
  0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}
  70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}
  100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
}
#status-text { flex:1; font-size:.82rem; color:#3a3a55; }
#end-btn {
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
  border-radius:8px; padding:10px 16px; color:#4a4a62;
  cursor:pointer; font-size:.8rem; transition:all .2s;
}
#end-btn:hover { color:#e4e4f0; border-color:rgba(255,255,255,.2); }
#back-btn {
  position:fixed; top:18px; left:18px; z-index:200;
  background:rgba(10,10,24,.8); border:1px solid rgba(255,255,255,.08);
  border-radius:8px; padding:7px 14px; color:#5a5a72;
  text-decoration:none; font-size:.8rem; transition:all .2s;
}
#back-btn:hover { color:#e4e4f0; }
#mic-hint {
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  background:rgba(10,10,28,.85); backdrop-filter:blur(12px);
  border:1px solid rgba(139,92,246,.2); border-radius:50px;
  padding:7px 18px; font-size:.78rem; color:#7070a0; z-index:200;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<a href="/" id="back-btn">← Landscape</a>
<div id="mic-hint">Loading avatar…</div>

<div id="hud">
  <div id="hud-inner">
    <div id="transcript"></div>
    <div id="controls">
      <button id="mic-btn" onclick="toggleMic()" title="Hold to speak">🎤</button>
      <input id="type-input" type="text" placeholder="Or type here and press Enter…" onkeydown="if(event.key==='Enter')sendTyped()" style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(139,92,246,.2);border-radius:8px;padding:10px 14px;color:#e4e4f0;font-size:.85rem;outline:none;font-family:inherit;">
      <button onclick="sendTyped()" style="background:rgba(139,92,246,.3);border:1px solid rgba(139,92,246,.4);border-radius:8px;padding:10px 14px;color:#c4b5fd;cursor:pointer;font-size:.82rem;">Send</button>
      <button id="end-btn" onclick="endSession()">End</button>
    </div>
    <div id="status-text" style="font-size:.75rem;color:#3a3a55;margin-top:6px;">Starting…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ===== STATE =====
const API = window.location.origin; // always hits the right server
let sessionId=null, sessionStart=null, turnCount=0;
let isListening=false, isSpeaking=false;
let recognition=null;
let avatarMixer=null, headBone=null;

// ===== RENDERER =====
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x06060f);
renderer.shadowMap.enabled = true;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x06060f, 5, 18);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 50);
camera.position.set(0, 1.5, 3.0);
camera.lookAt(0, 0.9, 0);

// ===== LIGHTS =====
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const key = new THREE.DirectionalLight(0xfff5e4, 3.5);
key.position.set(2, 4, 3);
key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8888ff, 1.5);
fill.position.set(-3, 2, 2);
scene.add(fill);
const rim = new THREE.PointLight(0xa78bfa, 3, 6);
rim.position.set(0, 3.5, -1.5);
scene.add(rim);
const front = new THREE.PointLight(0xffffff, 2, 5);
front.position.set(0, 1.5, 3.5);
scene.add(front);

// ===== FLOOR =====
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({color:0x0a0a18, roughness:1, metalness:0})
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Ground glow
const glow = new THREE.Mesh(
  new THREE.CircleGeometry(0.9,64),
  new THREE.MeshBasicMaterial({color:0x4f46e5, transparent:true, opacity:0.07, side:THREE.DoubleSide})
);
glow.rotation.x = -Math.PI/2;
glow.position.y = 0.005;
scene.add(glow);

// Particles
const pg = new THREE.BufferGeometry();
const pp = new Float32Array(500*3);
for(let i=0;i<500;i++){pp[i*3]=(Math.random()-.5)*14;pp[i*3+1]=Math.random()*5;pp[i*3+2]=(Math.random()-.5)*14;}
pg.setAttribute('position', new THREE.Float32BufferAttribute(pp,3));
scene.add(new THREE.Points(pg, new THREE.PointsMaterial({color:0x3d3070,size:0.022,transparent:true,opacity:0.5})));

// ===== LOAD REAL HUMAN AVATAR (Michelle GLB, 1.66m, already in meters) =====
function buildAvatar() {
  const loader = new THREE.GLTFLoader();
  loader.load('/static/avatar.glb', (gltf) => {
    const av = gltf.scene;
    // Avaturn model - already in meters, faces -Z by default
    av.position.set(0, 0, 0);
    av.rotation.y = 0; // Avaturn faces camera already (no flip needed)
    av.traverse(n => {
      n.castShadow = true; n.receiveShadow = true;
      if (n.name === 'Head') headBone = n;
    });
    if (gltf.animations?.length) {
      avatarMixer = new THREE.AnimationMixer(av);
      const anim = gltf.animations[0]; // IdleV4.2
      avatarMixer.clipAction(anim).play();
      console.log('Playing animation:', anim.name);
    }
    scene.add(av);
    document.getElementById('mic-hint').textContent = 'Click mic to speak';
    // Remove placeholder
    if (window._placeholder) { scene.remove(window._placeholder); }
  }, null, () => { /* fallback already built */ });
}

function buildPlaceholder() {
  const g = new THREE.Group();
  const P = c => new THREE.MeshPhongMaterial({color:c,shininess:40});
  const S = (geo,col,x,y,z,sx,sy,sz) => {
    const m = new THREE.Mesh(geo, P(col));
    m.position.set(x,y,z);
    if(sx) m.scale.set(sx,sy,sz);
    m.castShadow=true; g.add(m); return m;
  };

  // Legs
  S(new THREE.CylinderGeometry(.09,.08,.6,16),  0x1e1b4b,  -.11,.33,0);
  S(new THREE.CylinderGeometry(.09,.08,.6,16),  0x1e1b4b,   .11,.33,0);
  S(new THREE.BoxGeometry(.13,.07,.24),          0x111120,  -.11,-.01,.04);
  S(new THREE.BoxGeometry(.13,.07,.24),          0x111120,   .11,-.01,.04);

  // Torso
  S(new THREE.CylinderGeometry(.19,.22,.68,24),  0x3730a3, 0,1.02,0);

  // Arms
  [-.32,.32].forEach(x=>{
    S(new THREE.CylinderGeometry(.068,.058,.44,14), 0x3730a3, x*.88,1.0,0, 1,1,1);
    S(new THREE.CylinderGeometry(.055,.048,.36,12), 0xf5c5a3, x*.98,.69,0);
    S(new THREE.SphereGeometry(.072,14,14),          0xf5c5a3, x*1.02,.47,0);
  });

  // Neck
  S(new THREE.CylinderGeometry(.078,.092,.17,16), 0xf5c5a3, 0,1.47,0);

  // Head
  const head = S(new THREE.SphereGeometry(.23,32,32), 0xf5c5a3, 0,1.73,0, 1,1.1,1);
  headBone = head;

  // Hair
  S(new THREE.SphereGeometry(.245,32,16,0,Math.PI*2,0,Math.PI*.56), 0x180a06, 0,1.79,-.01);
  S(new THREE.BoxGeometry(.08,.32,.06),  0x180a06, -.2,1.6,.03);
  S(new THREE.BoxGeometry(.08,.32,.06),  0x180a06,  .2,1.6,.03);

  // Eyes
  [-.08,.08].forEach(x=>{
    S(new THREE.SphereGeometry(.035,16,16), 0xfafafa,  x,1.745,.19,  1,1,.55);
    S(new THREE.SphereGeometry(.022,12,12), 0x162840,  x,1.745,.215, 1,1,.45);
    S(new THREE.SphereGeometry(.011,8,8),   0x050505,  x,1.745,.222, 1,1,.3);
    S(new THREE.SphereGeometry(.006,6,6),   0xffffff,  x+.01,1.752,.225);
  });

  // Eyebrows
  S(new THREE.BoxGeometry(.058,.011,.007), 0x180a06, -.08,1.8,.2, 1,1,1);
  S(new THREE.BoxGeometry(.058,.011,.007), 0x180a06,  .08,1.8,.2, 1,1,1);

  // Nose
  S(new THREE.SphereGeometry(.02,10,10),  0xeaaa88, 0,1.7,.218, 1,.8,.7);
  S(new THREE.SphereGeometry(.013,8,8),   0xe0a880, -.026,1.688,.212);
  S(new THREE.SphereGeometry(.013,8,8),   0xe0a880,  .026,1.688,.212);

  // Mouth
  S(new THREE.CylinderGeometry(.038,.038,.008,20,1,false,0,Math.PI), 0xd07878, 0,1.655,.218, 1,1,1);
  S(new THREE.CylinderGeometry(.032,.032,.008,20,1,false,Math.PI,Math.PI), 0xb86060, 0,1.643,.218, 1,1,1);

  // Ears
  S(new THREE.SphereGeometry(.04,12,12), 0xf0c0a0, -.23,1.73,.0, 1,1,.45);
  S(new THREE.SphereGeometry(.04,12,12), 0xf0c0a0,  .23,1.73,.0, 1,1,.45);

  g.position.y = 0;
  window._placeholder = g;
  scene.add(g);
  return g;
}

// Show placeholder immediately, replace with real avatar when loaded
buildPlaceholder();
buildAvatar();

// ===== ANIMATION LOOP =====
const clock = new THREE.Clock();
let t=0;
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;
  if (avatarMixer) avatarMixer.update(dt);
  if (headBone) {
    headBone.rotation.y = Math.sin(t*.35)*.05;
    headBone.rotation.x = Math.sin(t*.28)*.025 - .03;
  }
  glow.material.opacity = .05 + Math.sin(t*1.4)*.025 + (isSpeaking?.05:0);
  rim.intensity = 3 + (isSpeaking ? Math.sin(t*7)*.8 : 0);
  renderer.render(scene, camera);
}
animate();

// ===== SESSION =====
async function startSession() {
  try {
    const r = await fetch(API+'/session/start',{method:'POST'});
    const d = await r.json();
    sessionId=d.session_id; sessionStart=Date.now(); turnCount=0;
    await agentSpeak("Hey, good to see you. How's your day been going?");
    document.getElementById('type-input').focus();
  } catch(e) { setStatus('Server error — is the backend running?'); }
}

// ===== MIC =====
function setupRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus('Browser speech not supported — try Chrome'); return null; }
  const r = new SR();
  r.continuous = false;
  r.interimResults = true;
  r.lang = 'en-US';
  let lastTranscript = '';
  r.onresult = (e) => {
    const txt = Array.from(e.results).map(x=>x[0].transcript).join('');
    lastTranscript = txt;
    if (e.results[e.results.length-1].isFinal) {
      stopListening();
      if (txt.trim()) sendMessage(txt);
    } else {
      setStatus('🎤 ' + txt);
    }
  };
  r.onerror = (e) => {
    console.error('Speech error:', e.error);
    stopListening();
    setStatus('Mic error: ' + e.error + ' — try typing instead');
    document.getElementById('type-input').focus();
  };
  r.onend = () => {
    // If we have a transcript but isFinal never fired, send it anyway
    if (isListening && lastTranscript.trim()) {
      stopListening();
      sendMessage(lastTranscript);
    } else if (isListening) {
      stopListening();
    }
    lastTranscript = '';
  };
  return r;
}

function toggleMic() {
  if (isSpeaking) return;
  isListening ? stopListening() : startListening();
}

function startListening() {
  if (!recognition) recognition = setupRecognition();
  if (!recognition) {
    document.getElementById('type-input').focus();
    setStatus('Voice not supported — type below');
    return;
  }
  isListening = true;
  document.getElementById('mic-btn').className = 'listening';
  document.getElementById('mic-btn').textContent = '🔴';
  setStatus('Listening… speak now');
  try { recognition.start(); } catch(e){
    console.error(e);
    stopListening();
    document.getElementById('type-input').focus();
    setStatus('Mic unavailable — type below');
  }
}

function stopListening() {
  isListening = false;
  document.getElementById('mic-btn').className = '';
  document.getElementById('mic-btn').textContent = '🎤';
  try { recognition.stop(); } catch(e){}
}

// ===== CHAT =====
async function sendMessage(text) {
  if (!text.trim()) return;
  if (!sessionId) {
    setStatus('Session not ready — restarting...');
    await startSession();
    return;
  }
  addLine('user', text);
  turnCount++;
  setStatus('Thinking…');
  try {
    const r = await fetch(API+'/session/chat',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session_id:sessionId, text})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    await agentSpeak(d.reply);
  } catch(e) {
    console.error('Chat error:', e);
    setStatus('Error: ' + e.message + ' — is server running?');
  }
}

async function agentSpeak(text) {
  addLine('agent', text);
  isSpeaking = true;
  document.getElementById('mic-btn').className = 'speaking';
  document.getElementById('mic-btn').textContent = '🔊';
  setStatus('Speaking…');
  await new Promise((resolve) => {
    if (!window.speechSynthesis) { setTimeout(resolve, text.length*42); return; }
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v=>v.name==='Samantha')||voices.find(v=>v.name.includes('Karen'))||voices.find(v=>v.lang==='en-US'&&v.localService)||voices[0];
    if (v) utt.voice = v;
    utt.rate = 0.9; utt.pitch = 1.05; utt.volume = 1;
    utt.onend = resolve; utt.onerror = resolve;
    window.speechSynthesis.speak(utt);
  });
  isSpeaking = false;
  document.getElementById('mic-btn').className = '';
  document.getElementById('mic-btn').textContent = '🎤';
  setStatus('Click mic to speak');
}

async function endSession() {
  if (!sessionId) { window.location.href='/'; return; }
  const dur=(Date.now()-sessionStart)/1000;
  await agentSpeak("It was good talking with you. Take care of yourself.");
  await fetch(API+'/session/end',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:sessionId, duration_seconds:dur, turn_count:turnCount})
  });
  setTimeout(()=>window.location.href='/', 1200);
}

function addLine(speaker, text) {
  const d=document.createElement('div');
  d.className=`line ${speaker}`; d.textContent=text;
  const t=document.getElementById('transcript');
  t.appendChild(d); t.scrollTop=t.scrollHeight;
}
function setStatus(m) { document.getElementById('status-text').textContent=m; }
function sendTyped() {
  const inp = document.getElementById('type-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  sendMessage(text);
}

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// Chrome requires user gesture before speech + mic
// Show a start button overlay
const startOverlay = document.createElement('div');
startOverlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(4,4,14,.92);cursor:pointer;';
startOverlay.innerHTML = `
  <div style="text-align:center;pointer-events:none;">
    <div style="font-size:2.5rem;margin-bottom:16px;">🧠</div>
    <div style="font-size:1.1rem;font-weight:700;color:#c4b5fd;margin-bottom:8px;">EmoScape Session Room</div>
    <div style="font-size:.85rem;color:#5a5a82;margin-bottom:8px;">Your therapist avatar is ready.</div>
    <div style="font-size:.75rem;color:#3a3a52;margin-bottom:28px;">Voice works best in Chrome. You can also type.</div>
    <div style="background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;padding:14px 32px;color:white;font-size:1rem;font-weight:700;display:inline-block;">Click anywhere to begin</div>
  </div>
`;
startOverlay.addEventListener('click', beginSession);
document.body.appendChild(startOverlay);

window.beginSession = async function() {
  startOverlay.remove();
  // Pre-load voices
  if (window.speechSynthesis) window.speechSynthesis.getVoices();
  // Request mic permission explicitly
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop()); // just for permission
  } catch(e) { console.warn('Mic permission denied:', e); }
  startSession();
};
</script>
</body>
</html>
